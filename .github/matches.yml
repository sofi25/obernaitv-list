name: Update Football Matches
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Today Matches
        run: |
          python3 -c '
          import urllib.request, json
          from datetime import datetime, timedelta

          leagues = [
              ("uefa.champions", "دوري أبطال أوروبا"),
              ("uefa.europa", "الدوري الأوروبي"),
              ("eng.1", "الدوري الإنجليزي"),
              ("esp.1", "الدوري الإسباني"),
              ("ita.1", "الدوري الإيطالي"),
              ("ger.1", "الدوري الألماني"),
              ("fra.1", "الدوري الفرنسي"),
              ("caf.nations", "كأس أمم أفريقيا"),
              ("fifa.worldq.caf", "تصفيات كأس العالم"),
              ("fifa.friendly", "مباريات دولية ودية")
          ]

          teams_ar = {
              "Real Madrid": "ريال مدريد", "Barcelona": "برشلونة", "Atletico Madrid": "أتلتيكو مدريد",
              "Liverpool": "ليفربول", "Man City": "مانشستر سيتي", "Man United": "مانشستر يونايتد",
              "Arsenal": "آرسنال", "Chelsea": "تشيلسي", "Tottenham": "توتنهام",
              "Bayern Munich": "بايرن ميونخ", "Borussia Dortmund": "دورتموند",
              "PSG": "باريس سان جيرمان", "Marseille": "مارسيليا", "Lyon": "ليون",
              "Inter": "إنتر ميلان", "AC Milan": "ميلان", "Juventus": "يوفنتوس", "Napoli": "نابولي",
              "Algeria": "الجزائر", "Morocco": "المغرب", "Tunisia": "تونس", "Egypt": "مصر"
          }

          today_str = datetime.utcnow().strftime("%Y%m%d")
          matches = []

          for code, ar_name in leagues:
              try:
                  url = f"https://espn.com{code}/scoreboard?dates={today_str}"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = json.loads(urllib.request.urlopen(req, timeout=10).read().decode())
                  for ev in data.get("events", []):
                      comp = ev["competitions"][0]
                      c0, c1 = comp["competitors"][0], comp["competitors"][1]
                      state = ev["status"]["type"]["state"]
                      status = "LIVE" if state == "in" else ("FINISHED" if state == "post" else "UPCOMING")
                      
                      raw_time = ev.get("date", "")[11:16]
                      try:
                          h, m = map(int, raw_time.split(":"))
                          h = (h + 1) % 24
                          time_str = f"{h:02d}:{m:02d}"
                      except Exception:
                          time_str = raw_time

                      score = f"{c0.get(\"score\",\"0\")} - {c1.get(\"score\",\"0\")}" if status != "UPCOMING" else time_str
                      h_raw = c0["team"]["shortDisplayName"]
                      a_raw = c1["team"]["shortDisplayName"]
                      matches.append({
                          "league": ar_name,
                          "homeTeam": teams_ar.get(h_raw, h_raw),
                          "homeLogo": c0["team"].get("logo", ""),
                          "awayTeam": teams_ar.get(a_raw, a_raw),
                          "awayLogo": c1["team"].get("logo", ""),
                          "time": time_str,
                          "status": status,
                          "score": score,
                          "channel": "BEIN"
                      })
              except Exception as e:
                  print("Error:", code, e)

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(matches, f, ensure_ascii=False, indent=2)
          '
      - name: Save to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update matches" && git push)
